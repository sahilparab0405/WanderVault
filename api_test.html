<!DOCTYPE html>
<html>
<head>
    <title>API Test Dashboard</title>
</head>
<body style="font-family: monospace; padding: 20px;">
    <h2>Step 2: API Test</h2>
    <button onclick="testRegister()">Test Register</button>
    <button onclick="testLogin()">Test Login</button>
    <pre id="log"></pre>

    <script>
        const API = 'https://wandervault-backend.onrender.com';
        const log = document.getElementById('log');
        const user = { name: "Test User", email: `test_${Date.now()}@test.com`, password: "password123" };

        function printLog(msg) {
            log.innerHTML += msg + "\n";
        }

        async function testRegister() {
            printLog("\n--- [REQUEST] POST /api/auth/register ---");
            printLog("Payload: " + JSON.stringify(user));
            try {
                const res = await fetch(`${API}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(user)
                });
                printLog(`Response Status: ${res.status}`);
                const data = await res.text();
                printLog("Response Body: " + data);
            } catch (err) {
                printLog("Error: " + err.message);
            }
        }

        async function testLogin() {
            printLog("\n--- [REQUEST] POST /api/auth/login ---");
            const payload = { email: user.email, password: user.password };
            printLog("Payload: " + JSON.stringify(payload));
            try {
                const res = await fetch(`${API}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                printLog(`Response Status: ${res.status}`);
                const data = await res.text();
                printLog("Response Body: " + data);
            } catch (err) {
                printLog("Error: " + err.message);
            }
        }
    </script>
</body>
</html>
